apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-intensive
  namespace: demo-app
  labels:
    app: memory-intensive
    workload-type: memory
spec:
  replicas: 2
  selector:
    matchLabels:
      app: memory-intensive
  template:
    metadata:
      labels:
        app: memory-intensive
        workload-type: memory
    spec:
      containers:
      - name: stress
        # Multi-arch image (amd64 + arm64), pinned by digest
        image: colinianking/stress-ng@sha256:501bb2ec4524b59ca0061c435de4f8f5a7592df938394fd0223208579b066d52
        args: ["--vm", "1", "--vm-bytes", "6G", "--vm-keep", "--timeout", "3600s", "--metrics-brief"]
        resources:
          requests:
            cpu: 250m
            memory: 8Gi
          limits:
            cpu: 500m
            memory: 8Gi
