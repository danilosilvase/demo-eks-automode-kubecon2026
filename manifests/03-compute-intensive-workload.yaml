apiVersion: apps/v1
kind: Deployment
metadata:
  name: compute-intensive
  namespace: demo-app
  labels:
    app: compute-intensive
    workload-type: compute
spec:
  replicas: 2
  selector:
    matchLabels:
      app: compute-intensive
  template:
    metadata:
      labels:
        app: compute-intensive
        workload-type: compute
    spec:
      containers:
      - name: stress
        # Multi-arch image (amd64 + arm64), pinned by digest
        image: colinianking/stress-ng@sha256:501bb2ec4524b59ca0061c435de4f8f5a7592df938394fd0223208579b066d52
        args: ["--cpu", "2", "--timeout", "3600s", "--metrics-brief"]
        resources:
          requests:
            cpu: 2000m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 1Gi
