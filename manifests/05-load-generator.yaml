apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: demo-app
  labels:
    app: load-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
      - name: busybox
        image: public.ecr.aws/docker/library/busybox:1.37
        command: ["/bin/sh"]
        args:
        - -c
        - |
          while true; do
            wget -q -O- http://sample-app.demo-app.svc.cluster.local
            sleep 0.1
          done
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
